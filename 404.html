<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Carnet PHY321</title>
<link rel="icon" href="/quantum-workbook/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="/quantum-workbook/assets/css/carnet.css">
</head>
<body>
<main class="wrap prose" style="padding:clamp(4rem,12vw,9rem) 0">
  <p class="eyebrow">Erreur 404</p>
  <h1>Cette page n’est dans aucun état propre.</h1>
  <p style="font-style:italic;color:var(--ink-2);font-size:1.2rem">La mesure a donné « introuvable ». L’adresse a peut-être changé lors de la refonte d’octobre 2026 : les chapitres sont désormais dans le dossier <code>chapitres/</code>.</p>
  <div class="btn-row" style="margin-top:2rem">
    <a class="btn accent" href="/quantum-workbook/">Retour au sommaire</a>
    <a class="btn ghost" href="https://tchapetnjafa.github.io/quantum-quiz/">Aller au quiz</a>
  </div>
</main>
<script>
  // Anciennes adresses et version anglaise (GitHub Pages sert cette page pour toute URL inconnue)
  (() => {
    const path = location.pathname;
    const accent = document.querySelector('.btn.accent'), ghost = document.querySelector('.btn.ghost');
    if (path.includes('/quantum-workbook/en/')) {
      document.documentElement.lang = 'en';
      document.title = 'Page not found — PHY321 Notebook';
      document.querySelector('.eyebrow').textContent = 'Error 404';
      document.querySelector('h1').textContent = 'This page is not in any eigenstate.';
      document.querySelector('main p:not(.eyebrow)').textContent = 'The measurement returned “not found”. The chapters are in the chapters/ folder.';
      accent.href = '/quantum-workbook/en/'; accent.textContent = 'Back to contents';
      ghost.href = 'https://tchapetnjafa.github.io/quantum-quiz/en/'; ghost.textContent = 'Go to the quiz';
      return;
    }
    // anciennes adresses chapters/chapterN.html : l'ancien découpage différait du cours
    const m = /chapters\/chapter(\d)\.html$/.exec(path);
    const map = { 1: '1-etats-quantiques', 2: '2-mesure-operateurs', 3: '2-mesure-operateurs', 4: '3-dynamique', 5: '4-intrication', 6: '5-fonction-etat' };
    if (!m || !map[m[1]]) return;
    accent.href = '/quantum-workbook/chapitres/' + map[m[1]] + '.html';
    accent.textContent = 'Ouvrir le chapitre correspondant';
  })();
</script>
</body>
</html>
